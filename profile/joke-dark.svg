
  <svg xmlns="http://www.w3.org/2000/svg" width="500" height="180" viewBox="0 0 500 180">
  
    <foreignObject width="100%" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml"> 
        <style>
          .qwidthDesktop{
            width: 500px;
          }
          .qwidthMobile{
            width: 80%;
          }
          .container {
            border: 2px solid #bf91f3;
            border-radius: 10px;
            background: #1a1b27;
          }
          .desktop{
            font-size: 18px;
          }
          .mobile{
            font-size: 45px;
          }
          .text{
            padding: 0.5rem;
            font-family: Arial, Helvetica, sans-serif;
          }
          .question {
            color: #70a5fd;
          }
          .answer {
            color: #38bdae;
          }
          code {
            font-size: 1.2rem;
            color: #f72585;
          }
        </style>
        <div class="container">
          <div class="text" style="font-size:18px">
            <p class="question"><b>Q.</b> Why are the arrays that Chuck Norris declare, of infinite size.</p>
            <p class="answer"><b>A.</b> Because Chuck Norris knows no bounds. </p>
          </div>
        </div>
      </div>
    </foreignObject>
  </svg>