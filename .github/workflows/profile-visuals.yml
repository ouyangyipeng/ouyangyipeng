name: Profile playground visuals

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, "codex/profile-*"]
    paths:
      - README.md
      - package.json
      - pnpm-lock.yaml
      - .github/scripts/**
      - .github/visuals.gitmessage
      - .github/workflows/profile-visuals.yml

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test

      - name: Generate public-data statistics and decorative cards
        run: |
          node .github/scripts/generate-extras.mjs
          node .github/scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out the pinned pixel renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: LuciNyan/pixel-profile
          ref: 7a7937a63421dd6eba82aaae31f73e85df8d9f94
          path: .generators/pixel
          persist-credentials: false
      - name: Generate CRT and Fuji pixel cards
        run: node .generators/pixel/action/libs/index.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_OUTPUTS: .build/visuals/pixel-fuji?username=ouyangyipeng&theme=fuji&pixelate_avatar=false
          INPUT_CRT_OUTPUTS: .build/visuals/pixel-crt?username=ouyangyipeng&include_all_commits=false

      - name: Generate contribution cities
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ouyangyipeng
      - name: Stage day and night cities
        run: |
          cp profile-3d-contrib/profile-night-view.svg .build/visuals/city.svg
          cp profile-3d-contrib/profile-season-animate.svg .build/visuals/city-light.svg

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@a041d6c27ba561a39f5be9c26a784812765e434b
        with:
          github_user_name: ouyangyipeng
          github_token: ${{ github.token }}
          outputs: |
            .build/visuals/snake-light.svg?color_snake=#9b8afb
            .build/visuals/snake-dark.svg?palette=github-dark&color_snake=#b9adf5
      - name: Generate contribution arcade animations
        run: node .github/scripts/generate-arcade.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out the pinned activity chart renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: .generators/activity
          persist-credentials: false
      - name: Build the official activity chart renderer
        working-directory: .generators/activity
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Render activity from the validated calendar
        run: node .github/scripts/render-activity.cjs

      - name: Check out the pinned streak renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: DenverCoder1/github-readme-streak-stats
          ref: da6003112250761ef2a7598c09591311489b89a2
          path: .generators/streak
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          extensions: intl, curl
          coverage: none
      - name: Install streak renderer dependencies
        working-directory: .generators/streak
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Render streaks over the past-year UTC window
        run: php .github/scripts/render-streak.php

      - name: Validate the complete image set before publication
        run: pnpm validate
      - name: Commit refreshed images to the current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -F .github/visuals.gitmessage
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
