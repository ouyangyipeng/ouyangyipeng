name: Profile contribution calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/metrics_display.yml

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: ouyangyipeng
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          committer_message: |
            [chore] Refresh contribution calendar

            Root cause: NA
            Solution: Update the generated six-month contribution calendar.
            Risks: NA
            Dependency: GitHub Metrics
            Links: https://github.com/lowlighter/metrics
          output_action: commit
          base: ""
          config_timezone: Asia/Singapore
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
